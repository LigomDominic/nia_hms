{% set f = form if form is defined and form else {} %}
<fieldset>
  <legend>Doctor for face-to-face consultation (cashier or nurse can assign)</legend>
  <div class="form-grid">
    <div class="field"><label for="doctor_id">Doctor</label>
      <select name="doctor_id" id="doctor_id"><option value="">-- Leave for nurse to assign --</option>
        {% for d in doctors %}<option value="{{ d.id }}" {% if f.get('doctor_id')|string == d.id|string %}selected{% endif %}>{{ d.display_name }}{% if d.specialty %} — {{ d.specialty }}{% endif %}{% if d.role == 'visiting_doctor' and 'Visiting' not in (d.specialty or '') %} (Visiting){% endif %}</option>{% endfor %}
      </select></div>
    <div class="field" style="grid-column: span 2"><label for="complaint">Presenting complaint</label><input name="complaint" id="complaint" data-voice value="{{ f.get('complaint','') }}" placeholder="e.g. Fever and headache for 3 days"></div>
  </div>
  <label class="check"><input type="checkbox" name="charge_consultation" value="1" id="charge_consultation" {% if f.get('charge_consultation') %}checked{% endif %}> Charge a consultation fee (optional)</label>
  <div class="form-grid" style="margin-top:.6rem">
    <div class="field"><label>Consultation fee</label><input name="consultation_fee" value="{{ f.get('consultation_fee', consultation_fee) }}"></div>
    <div class="field"><label>Payment method</label><select name="consultation_method">{% for k, v in methods.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
    <div class="field" style="align-self:end"><label class="check"><input type="checkbox" name="collect_consultation_now" value="1" checked> Collect now (otherwise wallet / queue)</label></div>
  </div>
</fieldset>
